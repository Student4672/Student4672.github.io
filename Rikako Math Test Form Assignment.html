<!--Start of Math Test-->
<form>

  <h1>Math Test</h1>

  <p>Name:</p>
  <input type="text" name="student">

  <fieldset>
    <legend>Question 1</legend>
    <p>What is 3&sup2; + 4 &times; 2?</p>
    <input type="radio" name="q1" value="14"> 14
    <input type="radio" name="q1" value="17"> 17
    <input type="radio" name="q1" value="25"> 25
  </fieldset>

  <fieldset>
    <legend>Question 2</legend>
    <p>What is 5/6 - 1/3?</p>
    <input type="radio" name="q2" value="1/2"> 1/2
    <input type="radio" name="q2" value="2/3"> 2/3
    <input type="radio" name="q2" value="1/3"> 1/3
  </fieldset>

  <fieldset>
    <legend>Question 3</legend>
    <p>Solve for x: 3x + 7 = 22.</p>
    <input type="radio" name="q3" value="3"> 3
    <input type="radio" name="q3" value="5"> 5
    <input type="radio" name="q3" value="7"> 7
  </fieldset>

  <fieldset>
    <legend>Word Problem</legend>
    <p>
      A student buys 3 notebooks for $4.50 each and pays with a $20 bill.
      How much change does the student get?
    </p>
    <textarea rows="5" cols="50"></textarea>
  </fieldset>

  <button type="submit">Submit</button>

</form>
<!--End of Math Test-->
